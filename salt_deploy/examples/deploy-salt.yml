name: Deploy Salt states

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: salt-master-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, salt-deploy]
    timeout-minutes: 10

    steps:
      - name: Promote pushed revision
        # The command re-fetches the branch and verifies this SHA is still
        # its head, so a delayed job cannot roll the master backwards.
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: sudo /usr/local/sbin/deploy-salt "$DEPLOY_SHA"
